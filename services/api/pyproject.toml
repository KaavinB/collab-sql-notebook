[project]
name = "notebook-api"
version = "0.1.0"
description = "REST API, query execution and AI service for the collaborative SQL notebook"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic==2.3.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.5",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    # DuckDB needs pytz to return TIMESTAMP WITH TIME ZONE values to Python.
    "pytz>=2026.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlglot>=30.31.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
notebook-api = "notebook_api.main:run"
notebook-ingest = "notebook_api.dataset.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pytz>=2026.6.0.20261031",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, B: bugbear, UP: modern syntax,
# S: bandit security checks, ASYNC: blocking calls in async code, RUF: ruff-specific.
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things.
# S608: tests build SQL strings on purpose (fixtures, large-query inputs).
"tests/**" = ["S101", "S608"]

[tool.mypy]
strict = true
# Type-checks pydantic model and settings constructors (field names and types).
plugins = ["pydantic.mypy"]
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
