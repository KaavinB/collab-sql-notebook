[[questions]]
id = "jfk-rate-endpoint-categories"
question = "For trips with the JFK rate (rate_code_id = 2), count trips in four endpoint categories: 'both' if pickup_location_id and dropoff_location_id are both 132; 'pickup_only' if only pickup is 132; 'dropoff_only' if only dropoff is 132; and 'neither' if neither is 132. Return the category and trip count for categories present in the data."
gold_sql = """
SELECT CASE
         WHEN pickup_location_id = 132 AND dropoff_location_id = 132 THEN 'both'
         WHEN pickup_location_id = 132 THEN 'pickup_only'
         WHEN dropoff_location_id = 132 THEN 'dropoff_only'
         ELSE 'neither'
       END AS endpoint_category,
       count(*) AS trip_count
FROM trips
WHERE rate_code_id = 2
GROUP BY endpoint_category
"""
difficulty = "moderate"
notes = "A JFK rate code does not guarantee that either recorded endpoint is JFK. Category tests are mutually exclusive."

[[questions]]
id = "march-dates-most-negative-totals"
question = "Which five pickup calendar dates in March 2024 had the most trips with total_amount < 0? Return each date as a DATE value and its count of negative-total trips."
gold_sql = """
SELECT cast(pickup_at AS DATE) AS pickup_date, count(*) AS trip_count
FROM trips
WHERE pickup_at >= TIMESTAMP '2024-03-01'
  AND pickup_at < TIMESTAMP '2024-04-01'
  AND total_amount < 0
