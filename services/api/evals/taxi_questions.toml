SELECT z.location_id, z.zone
FROM zones z
WHERE NOT EXISTS (
  SELECT 1
  FROM trips t
  WHERE t.pickup_location_id = z.location_id
    AND t.pickup_at >= TIMESTAMP '2024-03-01'
    AND t.pickup_at < TIMESTAMP '2024-04-01'
)
"""
difficulty = "moderate"
notes = "An anti-join must retain unused zones. IDs 103, 104, and 105 share a name but are distinct zones."

[[questions]]
id = "jfk-manhattan-hourly-mean-speed"
question = "For trips picked up at JFK (pickup_location_id 132) and dropped off in Manhattan according to zones, show the pickup hour (integer 0-23) and arithmetic mean of per-trip speed in mph, rounded to 2 decimal places. Speed is trip_distance divided by elapsed hours. Keep only distances > 0 and <= 100 miles and durations > 0 and <= 120 minutes; apply no other filters."
gold_sql = """
SELECT cast(extract(hour FROM t.pickup_at) AS INTEGER) AS pickup_hour,
       round(avg(t.trip_distance * 3600.0 / epoch(t.dropoff_at - t.pickup_at)), 2)
         AS mean_mph
FROM trips t
JOIN zones d ON t.dropoff_location_id = d.location_id
WHERE t.pickup_location_id = 132 AND d.borough = 'Manhattan'
  AND t.trip_distance > 0 AND t.trip_distance <= 100
  AND t.dropoff_at > t.pickup_at
  AND t.dropoff_at <= t.pickup_at + INTERVAL '120 minutes'
GROUP BY pickup_hour
"""
difficulty = "moderate"
notes = "The arithmetic mean of individual speeds differs from total miles divided by total hours. All 24 pickup hours have eligible trips."

