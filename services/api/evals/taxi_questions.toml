[[questions]]
id = "monthly-negative-total-percentage"
question = "For each pickup month, return the month as YYYY-MM, the number of trips with total_amount < 0, and that number as a percentage of all trips picked up in that month. Round the percentage on a 0-100 scale to 2 decimal places."
gold_sql = """
SELECT strftime(pickup_at, '%Y-%m') AS pickup_month,
       count(*) FILTER (WHERE total_amount < 0) AS negative_count,
       round(100.0 * count(*) FILTER (WHERE total_amount < 0) / count(*), 2)
         AS negative_percentage
FROM trips
GROUP BY pickup_month
"""
difficulty = "moderate"

[[questions]]
id = "monthly-component-total-mismatches"
question = "For each pickup month (YYYY-MM), count trips where total_amount differs by more than one cent from fare_amount + extra + mta_tax + tip_amount + tolls_amount + improvement_surcharge + congestion_surcharge + airport_fee. Treat NULL components as zero. Convert each component and total_amount to integer cents by rounding 100 times its dollar value to the nearest integer, then add and compare in cents. Return only the month and mismatch count."
gold_sql = """
WITH amounts_in_cents AS (
  SELECT strftime(pickup_at, '%Y-%m') AS pickup_month,
         cast(round(total_amount * 100, 0) AS BIGINT) AS total_cents,
         cast(round(coalesce(fare_amount, 0) * 100, 0) AS BIGINT)
         + cast(round(coalesce(extra, 0) * 100, 0) AS BIGINT)
         + cast(round(coalesce(mta_tax, 0) * 100, 0) AS BIGINT)
         + cast(round(coalesce(tip_amount, 0) * 100, 0) AS BIGINT)
         + cast(round(coalesce(tolls_amount, 0) * 100, 0) AS BIGINT)
         + cast(round(coalesce(improvement_surcharge, 0) * 100, 0) AS BIGINT)
         + cast(round(coalesce(congestion_surcharge, 0) * 100, 0) AS BIGINT)
         + cast(round(coalesce(airport_fee, 0) * 100, 0) AS BIGINT) AS component_cents
  FROM trips
)
SELECT pickup_month,
       count(*) FILTER (WHERE abs(total_cents - component_cents) > 1) AS mismatch_count
FROM amounts_in_cents
GROUP BY pickup_month
"""
difficulty = "moderate"
notes = "Integer-cent arithmetic avoids floating-point boundary differences. This tests the stated component formula, not a claim that every mismatch is an invalid trip."

[[questions]]
id = "monthly-airport-fee-incidence"
question = "For each pickup month (YYYY-MM) and each airport pickup location, JFK 132 and LaGuardia 138, return the month, pickup location ID, and percentage of that month's pickups at that airport with airport_fee > 0. Use all pickups at that airport in the denominator, including NULL, zero, and negative airport_fee values. Round percentages on a 0-100 scale to 2 decimal places."
gold_sql = """
SELECT strftime(pickup_at, '%Y-%m') AS pickup_month, pickup_location_id,
       round(100.0 * count(*) FILTER (WHERE airport_fee > 0) / count(*), 2)
         AS positive_fee_percentage
FROM trips
WHERE pickup_location_id IN (132, 138)
GROUP BY pickup_month, pickup_location_id
"""
difficulty = "moderate"
notes = "NULL airport fees remain in the denominator and do not count as positive. Both airports have trips in all three months."

[[questions]]
id = "monthly-two-tip-percentage-definitions"
question = "For card trips (payment_type = 1) with fare_amount > 0 and tip_amount >= 0, compare two tip percentages by pickup month. Return YYYY-MM, the arithmetic mean of each trip's 100 * tip_amount / fare_amount, and 100 * sum(tip_amount) / sum(fare_amount), in that order. Round both percentages to 2 decimal places."
gold_sql = """
SELECT strftime(pickup_at, '%Y-%m') AS pickup_month,
       round(avg(100.0 * tip_amount / fare_amount), 2) AS mean_trip_tip_percentage,
       round(100.0 * sum(tip_amount) / sum(fare_amount), 2) AS aggregate_tip_percentage
FROM trips
WHERE payment_type = 1 AND fare_amount > 0 AND tip_amount >= 0
GROUP BY pickup_month
"""
difficulty = "moderate"
notes = "The first metric weights trips equally; the second weights them by fare. Recorded cash tips are not part of this population."

[[questions]]
id = "over-24-hour-trips-by-vendor"
question = "For each vendor with at least one trip whose dropoff_at is more than 24 elapsed hours after pickup_at, return the vendor_id, count of those trips, and longest duration among those trips in hours rounded to 2 decimal places."
gold_sql = """
SELECT vendor_id, count(*) AS trip_count,
       round(max(epoch(dropoff_at - pickup_at)) / 3600.0, 2) AS maximum_hours
FROM trips
WHERE dropoff_at > pickup_at + INTERVAL '24 hours'
GROUP BY vendor_id
"""
difficulty = "moderate"
notes = "Crossing a calendar date alone is insufficient. Exactly 24 hours is excluded."

[[questions]]
id = "high-cost-brooklyn-origin-zones"
question = "Among trips ending in Brooklyn according to zones, keep only fare_amount > 0 and total_amount > 0. Which pickup zones have at least 1000 such trips and an average total_amount greater than $50 before rounding? Return the pickup zone's location_id, zone name, eligible trip count, and average total_amount rounded to 2 decimal places."
gold_sql = """
SELECT p.location_id, p.zone, count(*) AS trip_count,
       round(avg(t.total_amount), 2) AS mean_total
FROM trips t
JOIN zones p ON t.pickup_location_id = p.location_id
JOIN zones d ON t.dropoff_location_id = d.location_id
WHERE d.borough = 'Brooklyn' AND t.fare_amount > 0 AND t.total_amount > 0
GROUP BY p.location_id, p.zone
HAVING count(*) >= 1000 AND avg(t.total_amount) > 50
"""
difficulty = "moderate"
notes = "Both the sample-size threshold and mean use only eligible Brooklyn-bound trips. No pickup borough restriction applies."

# --- Challenging (10) ------------------------------------------------------

[[questions]]
id = "monthly-busiest-zone-within-borough"
question = "For each pickup month and each borough label with pickups that month, find the pickup zone with the most trips within that borough and month. Include every zone tied for first. Return the month as YYYY-MM, borough, location_id, zone name, and trip count. Use all borough labels in zones."
gold_sql = """
WITH zone_counts AS (
  SELECT strftime(t.pickup_at, '%Y-%m') AS pickup_month,
         z.borough, z.location_id, z.zone, count(*) AS trip_count
  FROM trips t
  JOIN zones z ON t.pickup_location_id = z.location_id
  GROUP BY pickup_month, z.borough, z.location_id, z.zone
), ranked AS (
  SELECT *, rank() OVER (
    PARTITION BY pickup_month, borough ORDER BY trip_count DESC
  ) AS position
  FROM zone_counts
)
SELECT pickup_month, borough, location_id, zone, trip_count
FROM ranked
WHERE position = 1
"""
difficulty = "challenging"
notes = "Rank within each month/borough, not across the whole city. Tied winners are retained."

[[questions]]
id = "daily-quarter-running-trip-count"
question = "For every pickup calendar date from January 1 through March 31, 2024 inclusive, return the date as DATE, that day's trip count, and the cumulative trip count from January 1 through that date inclusive. The cumulative count must not reset at month boundaries."
gold_sql = """
WITH daily AS (
  SELECT cast(pickup_at AS DATE) AS pickup_date, count(*) AS trip_count
  FROM trips
  WHERE pickup_at >= TIMESTAMP '2024-01-01'
    AND pickup_at < TIMESTAMP '2024-04-01'
  GROUP BY pickup_date
)
SELECT pickup_date, trip_count,
       sum(trip_count) OVER (
         ORDER BY pickup_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
       ) AS cumulative_trip_count
FROM daily
"""
difficulty = "challenging"
notes = "Every calendar date in this quarter has trips. Aggregate by date before computing the cumulative count."

[[questions]]
id = "borough-month-over-month-growth"
question = "For each of Manhattan, Brooklyn, Queens, Bronx, and Staten Island, compare pickup counts month over month. Return one row for February 2024 and one for March 2024 per borough, with YYYY-MM, borough, that month's pickup count, and percentage change from the previous month's count, rounded to 2 decimal places. Use January as February's baseline; compute 100 * (current - previous) / previous."
gold_sql = """
WITH monthly AS (
  SELECT strftime(t.pickup_at, '%Y-%m') AS pickup_month, z.borough,
         count(*) AS trip_count
  FROM trips t
  JOIN zones z ON t.pickup_location_id = z.location_id
  WHERE t.pickup_at >= TIMESTAMP '2024-01-01'
    AND t.pickup_at < TIMESTAMP '2024-04-01'
    AND z.borough IN ('Manhattan', 'Brooklyn', 'Queens', 'Bronx', 'Staten Island')
  GROUP BY pickup_month, z.borough
), with_previous AS (
  SELECT *, lag(trip_count) OVER (
    PARTITION BY borough ORDER BY pickup_month
  ) AS previous_count
  FROM monthly
)
SELECT pickup_month, borough, trip_count,
       round(100.0 * (trip_count - previous_count) / previous_count, 2) AS change_percentage
FROM with_previous
WHERE pickup_month IN ('2024-02', '2024-03')
"""
difficulty = "challenging"
notes = "All five boroughs have positive counts in all three months. January must remain available until after lag is computed."

[[questions]]
id = "airport-top-destinations-with-ties"
question = "Separately for JFK pickups (pickup_location_id 132) and LaGuardia pickups (138), find destination zones at the three highest distinct destination trip counts, including every tie at those counts. Return pickup location ID, dropoff location ID, destination zone name, trip count, and that destination's percentage of all trips from that pickup airport, rounded to 2 decimal places on a 0-100 scale. Use all trips and all destinations in each airport's denominator."
gold_sql = """
WITH destination_counts AS (
  SELECT t.pickup_location_id, t.dropoff_location_id, z.zone,
         count(*) AS trip_count
  FROM trips t
  JOIN zones z ON t.dropoff_location_id = z.location_id
  WHERE t.pickup_location_id IN (132, 138)
  GROUP BY t.pickup_location_id, t.dropoff_location_id, z.zone
), ranked AS (
  SELECT *, dense_rank() OVER (
    PARTITION BY pickup_location_id ORDER BY trip_count DESC
  ) AS position,
  sum(trip_count) OVER (PARTITION BY pickup_location_id) AS airport_trip_count
  FROM destination_counts
)
SELECT pickup_location_id, dropoff_location_id, zone, trip_count,
       round(100.0 * trip_count / airport_trip_count, 2) AS destination_percentage
FROM ranked
WHERE position <= 3
"""
difficulty = "challenging"
notes = "Three distinct count levels means dense_rank. Compute each airport's denominator before selecting its leading destinations."

[[questions]]
id = "pickup-zones-fastest-january-march-growth"
question = "Which five pickup zones had the largest percentage growth in trip count from January to March 2024, considering only zones with at least 100 January pickups? Use pickup_at for both months and rank by the unrounded value of 100 * (March count - January count) / January count. Return location_id, zone name, January count, March count, and growth percentage rounded to 2 decimal places."
gold_sql = """
WITH counts AS (
  SELECT pickup_location_id,
         count(*) FILTER (
           WHERE pickup_at >= TIMESTAMP '2024-01-01'
             AND pickup_at < TIMESTAMP '2024-02-01'
         ) AS january_count,
         count(*) FILTER (
           WHERE pickup_at >= TIMESTAMP '2024-03-01'
             AND pickup_at < TIMESTAMP '2024-04-01'
         ) AS march_count
  FROM trips
  GROUP BY pickup_location_id
)
SELECT z.location_id, z.zone, c.january_count, c.march_count,
       round(100.0 * (c.march_count - c.january_count) / c.january_count, 2)
         AS growth_percentage
FROM counts c
JOIN zones z ON c.pickup_location_id = z.location_id
WHERE c.january_count >= 100
ORDER BY 100.0 * (c.march_count - c.january_count) / c.january_count DESC
LIMIT 5
"""
difficulty = "challenging"
notes = "The fifth growth rate is about 105.32%, versus 101.89% for sixth, with no cutoff tie. January and March have equal calendar lengths."

[[questions]]
id = "march-seven-day-average-pickups"
question = "For every pickup calendar date in March 2024, return the date as DATE and the trailing seven-calendar-day average of daily trip counts, rounded to 2 decimal places. Each window includes that date and the six preceding dates, including February dates where needed. Count a day with no trips as zero and always divide by seven."
gold_sql = """
WITH calendar AS (
  SELECT cast(day_value AS DATE) AS pickup_date
  FROM generate_series(
    TIMESTAMP '2024-02-24', TIMESTAMP '2024-03-31', INTERVAL '1 day'
  ) AS dates(day_value)
), daily AS (
  SELECT cast(pickup_at AS DATE) AS pickup_date, count(*) AS trip_count
  FROM trips
  WHERE pickup_at >= TIMESTAMP '2024-02-24'
    AND pickup_at < TIMESTAMP '2024-04-01'
  GROUP BY pickup_date
), rolling AS (
  SELECT c.pickup_date,
         avg(coalesce(d.trip_count, 0)) OVER (
           ORDER BY c.pickup_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW
         ) AS seven_day_average
  FROM calendar c
  LEFT JOIN daily d ON c.pickup_date = d.pickup_date
)
SELECT pickup_date, round(seven_day_average, 2) AS seven_day_average
FROM rolling
WHERE pickup_date >= DATE '2024-03-01'
"""
difficulty = "challenging"
notes = "Leap-year February 24 is six days before March 1. Filter to March after computing windows, not before."

[[questions]]
id = "manhattan-zones-covering-80-percent"
question = "For January 2024 pickups in Manhattan according to zones, order pickup zones by decreasing trip count, breaking equal counts by increasing location_id. Take the shortest prefix of this ordering that accounts for at least 80% of all Manhattan pickups that month, including the zone that reaches the threshold. Return each selected location_id, zone name, trip count, and cumulative percentage of Manhattan pickups rounded to 2 decimal places on a 0-100 scale."
gold_sql = """
WITH counts AS (
  SELECT z.location_id, z.zone, count(*) AS trip_count
  FROM trips t
  JOIN zones z ON t.pickup_location_id = z.location_id
  WHERE z.borough = 'Manhattan'
    AND t.pickup_at >= TIMESTAMP '2024-01-01'
    AND t.pickup_at < TIMESTAMP '2024-02-01'
  GROUP BY z.location_id, z.zone
), cumulative AS (
  SELECT *,
         sum(trip_count) OVER (
           ORDER BY trip_count DESC, location_id ASC
           ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
         ) AS cumulative_count,
         sum(trip_count) OVER () AS total_count
  FROM counts
)
SELECT location_id, zone, trip_count,
       round(100.0 * cumulative_count / total_count, 2) AS cumulative_percentage
FROM cumulative
WHERE 100 * (cumulative_count - trip_count) < 80 * total_count
"""
difficulty = "challenging"
notes = "Selection uses the unrounded cumulative counts and retains the threshold-crossing zone. Integer comparison avoids a rounded-percentage cutoff."

[[questions]]
id = "borough-net-inflow-ranking"
question = "Across all trips, calculate pickup count and dropoff count independently for each of Manhattan, Brooklyn, Queens, Bronx, and Staten Island, using zones for each endpoint. Include trips whose other endpoint is outside these five boroughs. Return borough, pickup count, dropoff count, net inflow (dropoffs minus pickups), and rank by descending net inflow. Equal net inflows share a rank and leave gaps in subsequent ranks, as in 1, 1, 3."
gold_sql = """
WITH pickups AS (
  SELECT z.borough, count(*) AS pickup_count
  FROM trips t
  JOIN zones z ON t.pickup_location_id = z.location_id
  WHERE z.borough IN ('Manhattan', 'Brooklyn', 'Queens', 'Bronx', 'Staten Island')
  GROUP BY z.borough
), dropoffs AS (
  SELECT z.borough, count(*) AS dropoff_count
  FROM trips t
  JOIN zones z ON t.dropoff_location_id = z.location_id
  WHERE z.borough IN ('Manhattan', 'Brooklyn', 'Queens', 'Bronx', 'Staten Island')
  GROUP BY z.borough
), flows AS (
  SELECT p.borough, p.pickup_count, d.dropoff_count,
         cast(d.dropoff_count AS BIGINT) - cast(p.pickup_count AS BIGINT) AS net_inflow
  FROM pickups p
  JOIN dropoffs d ON p.borough = d.borough
)
SELECT borough, pickup_count, dropoff_count, net_inflow,
       rank() OVER (ORDER BY net_inflow DESC) AS inflow_rank
FROM flows
"""
difficulty = "challenging"
notes = "Same-borough trips contribute to both counts and cancel in net inflow. Both endpoints must not be restricted to NYC before counting."

[[questions]]
id = "weekday-normalized-january-march-comparison"
question = "Compare January and March 2024 pickup activity for each ISO weekday (Monday = 1 through Sunday = 7). For each weekday, average the daily pickup counts over all calendar dates of that weekday within each month, counting any date with no trips as zero. Return the weekday number, January mean daily count, March mean daily count, and percentage change 100 * (March mean - January mean) / January mean. Round all three non-integer results to 2 decimal places, calculating the change from unrounded means."
gold_sql = """
WITH calendar AS (
  SELECT cast(day_value AS DATE) AS pickup_date
  FROM generate_series(
    TIMESTAMP '2024-01-01', TIMESTAMP '2024-03-31', INTERVAL '1 day'
  ) AS dates(day_value)
), daily AS (
  SELECT cast(pickup_at AS DATE) AS pickup_date, count(*) AS trip_count
  FROM trips
  WHERE pickup_at >= TIMESTAMP '2024-01-01'
    AND pickup_at < TIMESTAMP '2024-04-01'
  GROUP BY pickup_date
), weekday_means AS (
  SELECT cast(extract(isodow FROM c.pickup_date) AS INTEGER) AS iso_weekday,
         avg(coalesce(d.trip_count, 0)) FILTER (
           WHERE extract(month FROM c.pickup_date) = 1
         ) AS january_mean,
         avg(coalesce(d.trip_count, 0)) FILTER (
           WHERE extract(month FROM c.pickup_date) = 3
         ) AS march_mean
  FROM calendar c
  LEFT JOIN daily d ON c.pickup_date = d.pickup_date
  GROUP BY iso_weekday
)
SELECT iso_weekday, round(january_mean, 2) AS january_mean,
       round(march_mean, 2) AS march_mean,
       round(100.0 * (march_mean - january_mean) / january_mean, 2) AS change_percentage
FROM weekday_means
"""
difficulty = "challenging"
notes = "This compares mean trips per occurrence of a weekday, not monthly weekday totals; January and March have different weekday compositions."

[[questions]]
id = "zone-median-tip-above-overall"
question = "Use only card trips (payment_type = 1) with fare_amount > 0 and tip_amount >= 0, and define each trip's tip percentage as 100 * tip_amount / fare_amount. Which pickup zones have at least 1000 eligible trips and a continuous median tip percentage at least 0.5 percentage points above the continuous median across all eligible trips in the database, including all pickup locations? Compare unrounded medians. Return location_id, zone name, eligible trip count, zone median percentage, and overall median percentage; round both medians to 2 decimal places."
gold_sql = """
WITH eligible AS (
  SELECT pickup_location_id, 100.0 * tip_amount / fare_amount AS tip_percentage
  FROM trips
  WHERE payment_type = 1 AND fare_amount > 0 AND tip_amount >= 0
), overall AS (
  SELECT median(tip_percentage) AS overall_median
  FROM eligible
), zone_medians AS (
  SELECT pickup_location_id, count(*) AS trip_count,
         median(tip_percentage) AS zone_median
  FROM eligible
  GROUP BY pickup_location_id
  HAVING count(*) >= 1000
)
SELECT z.location_id, z.zone, m.trip_count,
       round(m.zone_median, 2) AS zone_median,
       round(o.overall_median, 2) AS overall_median
FROM zone_medians m
JOIN zones z ON m.pickup_location_id = z.location_id
CROSS JOIN overall o
WHERE m.zone_median >= o.overall_median + 0.5
"""
difficulty = "challenging"
notes = "The overall median is over individual eligible trips, including zones below the 1000-trip threshold and special location IDs. It is not the median of zone medians."
