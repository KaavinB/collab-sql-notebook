[[questions]]
id = "february-daily-pickups"
question = "Show the trip count for every pickup calendar date in February 2024. Return the date as a DATE value and its count."
gold_sql = """
SELECT cast(pickup_at AS DATE) AS pickup_date, count(*) AS trip_count
FROM trips
WHERE pickup_at >= TIMESTAMP '2024-02-01'
  AND pickup_at < TIMESTAMP '2024-03-01'
GROUP BY pickup_date
"""
difficulty = "moderate"
notes = "Every February calendar date has trips, including February 29."

[[questions]]
id = "weekday-weekend-median-duration"
question = "Compare weekday and weekend trip durations across all trips, assigning the day from pickup_at. Keep only elapsed durations strictly greater than 0 and at most 120 minutes. Return the label 'weekday' (Monday-Friday) or 'weekend' (Saturday-Sunday) and the continuous median elapsed duration in minutes, rounded to 2 decimal places."
gold_sql = """
SELECT CASE WHEN extract(isodow FROM pickup_at) IN (6, 7)
            THEN 'weekend' ELSE 'weekday' END AS day_type,
       round(median(epoch(dropoff_at - pickup_at) / 60.0), 2) AS median_minutes
FROM trips
WHERE dropoff_at > pickup_at
  AND dropoff_at <= pickup_at + INTERVAL '120 minutes'
GROUP BY day_type
"""
difficulty = "moderate"
notes = "Duration uses elapsed timestamp time, not just clock time; no distance or fare filter applies."

[[questions]]
id = "card-share-among-card-and-cash-by-borough"
question = "For each pickup borough label in zones, what percentage of its trips paid by card among trips paid by card or cash? Use payment_type 1 for card and 2 for cash, exclude other payment codes from the denominator, and return just the borough and percentage on a 0-100 scale rounded to 2 decimal places."
gold_sql = """
SELECT z.borough,
       round(100.0 * count(*) FILTER (WHERE t.payment_type = 1) / count(*), 2)
         AS card_percentage
FROM trips t
JOIN zones z ON t.pickup_location_id = z.location_id
WHERE t.payment_type IN (1, 2)
GROUP BY z.borough
"""
difficulty = "moderate"
notes = "Includes all observed borough labels, including EWR, Unknown, and N/A. Each has eligible trips."

